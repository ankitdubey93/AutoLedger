server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed build assets never change under the same name — cache them hard.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else is a client-side route: serve the app shell. index.html
  # itself must never be cached, or a deploy would keep pointing browsers at
  # asset names that no longer exist.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
