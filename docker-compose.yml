# Infrastructure only. The Express server and Vite client run on the host,
# started from their own terminals — see docs/development.md.
#
# Values come from the root .env (copy .env.example). The defaults below apply
# when .env is absent, and must stay in sync with server/.env.example.

services:

  postgres:
    # pgvector/pgvector:pg16 is postgres:16 plus the `vector` extension. The
    # extension itself is no longer used — Phase 29 retired TaxGuard AI and
    # migration 068 drops it — but migration 044 still runs on a fresh database
    # and still calls CREATE EXTENSION vector, so the image cannot go back to
    # stock postgres:16 without breaking a from-scratch migrate.
    image: pgvector/pgvector:pg16
    container_name: autodb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-autodb_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-autodb_pass}
      POSTGRES_DB: ${PG_DATABASE:-autodb}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-autodb_user} -d ${PG_DATABASE:-autodb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A SECOND Postgres, for the test suite only — same image and major version
  # as `postgres` above, but with durability switched off.
  #
  # The suite's `resetTables()` TRUNCATEs ~55 tables before almost every test,
  # and TRUNCATE fsyncs a fresh relation file per table *and per index*.
  # Measured on this machine: 2055 ms with fsync on, 69 ms with it off — a 30x
  # difference, and the single largest cost in a 35-minute suite.
  #
  # This is a separate cluster rather than a flag on the one above because
  # `fsync` is cluster-wide: turning it off on `postgres` would put `autodb`'s
  # durability at risk too. Losing a test database to a crash costs nothing
  # (globalSetup re-clones it from a freshly migrated template every run);
  # losing the dev database would. Same reasoning as `autodb_test` never being
  # `autodb`, applied one level down.
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: autodb_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-autodb_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-autodb_pass}
      POSTGRES_DB: postgres
    # autovacuum is off as well: every test database is dropped and recreated
    # from the template each run, so nothing lives long enough to need it.
    command: >
      postgres
      -c fsync=off
      -c full_page_writes=off
      -c synchronous_commit=off
      -c autovacuum=off
    ports:
      - "${PG_TEST_PORT:-5433}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-autodb_user} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs BullMQ's job queues and the webhook dispatcher from Phase 7.
  redis:
    image: redis:7-alpine
    container_name: autodb_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # The application itself, containerized — opt-in via the `app` profile, so
  # `docker compose up` (and ./dev.sh, which names its services) still starts
  # only the databases above:
  #
  #   docker compose --profile app up --build
  #
  # Reads server/.env for secrets and settings, overriding only what differs
  # inside the compose network. Ports 5100 (API) and 8080 (web) sit beside the
  # host dev stack's 5000/5173, so both can run at once against the same
  # databases.
  # ---------------------------------------------------------------------------

  migrate:
    profiles: ["app"]
    build: ./server
    image: autoledger-server
    command: ["node", "dist/db/migrate.js"]
    env_file: server/.env
    environment: &server-environment
      NODE_ENV: production
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FRONTEND_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

  server:
    profiles: ["app"]
    image: autoledger-server
    env_file: server/.env
    environment:
      <<: *server-environment
      PORT: "5000"
    ports:
      - "5100:5000"
    volumes:
      - server-storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    image: autoledger-server
    command: ["node", "dist/worker.js"]
    env_file: server/.env
    environment: *server-environment
    volumes:
      - server-storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  client:
    profiles: ["app"]
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5100
        VITE_DEMO_EMAIL: ${VITE_DEMO_EMAIL:-}
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-}
    image: autoledger-client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres-data:
  postgres-test-data:
  server-storage:
